name: Build SARA Salon Manager APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Set up Java 17
      # Do NOT enable Gradle cache here because the Android
      # project does not exist yet.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 4. Install JavaScript dependencies
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 5. Build React/Vite application
      - name: Build web application
        run: npm run build

      # 6. Generate Android project
      - name: Add Android platform
        run: npx cap add android

      # 7. Install custom Salon SMS plugin
      - name: Install Salon SMS native plugin
        run: node scripts/setup-native-plugin.cjs

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Build Android APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 11. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK was not created."
            exit 1
          fi

          echo "✅ APK successfully created."
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sara-salon-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
